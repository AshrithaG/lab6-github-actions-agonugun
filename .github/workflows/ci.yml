name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

jobs:
  test:
    runs-on: [self-hosted, label-1]   # ← must match your runner label

    env:
      PYTHONPATH: ${{ github.workspace }}

    steps:
      - uses: actions/checkout@v4

      - name: Show Python
        run: |
          python3 --version || true
          which python3 || true

      - name: Install dependencies
        run: |
          PY=python3
          $PY -m pip install --upgrade pip
          $PY -m pip install -r requirements.txt

      - name: Run tests with coverage
        run: |
          PY=python3
          $PY -m pytest -q --cov=prediction_pipeline_demo --cov-report=term-missing --cov-fail-under=60

      - name: Run demo pipeline and verify output
        run: |
          PY=python3
          $PY prediction_pipeline_demo.py | tee demo_output.txt
          grep -q "Trained model score is:" demo_output.txt
